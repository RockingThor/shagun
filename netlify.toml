[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Next.js App Router on Netlify (OpenNext). Server routes can use Blobs.
[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  node_bundler = "nft"
  included_files = ["public/catalog/**", "public/demo/**"]
